<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>notes.md — 技术笔记与踩坑记录</title>
<meta name="description" content="一个关于前端、工程实践与性能调优的个人技术博客。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23111'/><text x='32' y='44' font-size='34' font-family='monospace' fill='%23fff' text-anchor='middle'>N</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="scroll-progress"><i id="progressBar"></i></div>

<header class="hdr">
  <div class="wrap hdr-in">
    <a class="logo" href="#/">notes<span>.md</span></a>

    <nav class="nav" id="nav">
      <a href="#/" data-nav="home">文章</a>
      <a href="#/tags" data-nav="tags">标签</a>
      <a href="#/archive" data-nav="archive">归档</a>
      <a href="#/about" data-nav="about">关于</a>
    </nav>

    <div class="hdr-act">
      <button class="ghost-btn" id="searchOpen" title="搜索文章 (Ctrl + K)">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>搜索</span><kbd>Ctrl K</kbd>
      </button>
      <button class="icon-btn" id="themeBtn" title="切换深浅主题" aria-label="切换主题">
        <svg class="i-sun" viewBox="0 0 24 24" width="17" height="17"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.6M12 19.4V22M2 12h2.6M19.4 12H22M4.9 4.9l1.9 1.9M17.2 17.2l1.9 1.9M19.1 4.9l-1.9 1.9M6.8 17.2l-1.9 1.9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="17" height="17"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="app"></main>

<footer class="ftr">
  <div class="wrap ftr-in">
    <div class="ftr-l">
      <div class="logo sm">notes<span>.md</span></div>
      <p>写下来的才算想清楚。</p>
    </div>
    <div class="ftr-r">
      <a href="#/">全部文章</a>
      <a href="#/tags">标签</a>
      <a href="#/archive">归档</a>
      <a href="#/about">关于</a>
      <a href="feed.xml">RSS</a>
      <span class="dim">© <span id="year"></span> 林深</span>
    </div>
  </div>
</footer>

<!-- 搜索浮层 -->
<div class="overlay" id="searchModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="搜索文章">
    <div class="modal-bar">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" id="searchInput" placeholder="搜索标题、摘要或标签…" autocomplete="off" spellcheck="false">
      <kbd>ESC</kbd>
    </div>
    <div class="modal-body" id="searchResult"></div>
  </div>
</div>

<script src="assets/js/markdown.js"></script>
<script src="assets/js/posts.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
